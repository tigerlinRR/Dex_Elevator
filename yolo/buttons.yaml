# Single-class `button` detection dataset (LOCALIZATION only).
#
# THIS IS A REFERENCE / SCHEMA. The authoritative, ready-to-train copy -- with an
# absolute `path` and the real split sizes -- is generated by prepare_dataset.py at:
#     data/datasets/buttons/data.yaml   (gitignored; regenerate it, don't commit)
# Train against that file. `yolo/train_buttons.py` uses it by default, so you rarely
# reference this template directly.
#
# All source classes (floor symbols, arrows, open/close, ...) are collapsed to the
# single class `button`. Which-floor identification is handled separately by
# `read_floor_label`, NOT by this detector. See ../DATASETS.md for data attribution.

# path: <absolute path to data/datasets/buttons -- filled in by prepare_dataset.py>
train: images/train
val: images/val
# test: images/test        # present only if a source provided a test split

nc: 1
names: [button]
