# DEX elevator button-pressing config.
# See core/elevator_pipeline.py, core/press.py, core/robot/realman.py; CLAUDE.md for architecture.

arm:
  make: realman
  # Single rest pose, used both for driving and as the pressing staging pose —
  # operator confirmed this tuck is safe to drive with. Sequence per press:
  #   home -> movej to standoff 50 mm -> movel contact -> movel push -> retract
  #   -> movej back to home
  #
  # Chosen 2026-08-20 over two other candidates on two criteria:
  #   1. the arm must NOT occlude the panel in the chest camera (YOLO needs the
  #      whole faceplate) — here both tool point and plunger tip project OUTSIDE
  #      the image entirely;
  #   2. every button must stay reachable.
  # Reachability from here (standoff 50 mm, 24 approach rolls swept) — nothing
  # unreachable, including `close`, which the earlier candidate could not reach:
  #   A 24/24 (165 deg)  dot 24/24   5 24/24 (155)  6 24/24
  #   3 24/24 (142)      4 20/24     1 23/24 (129)  2  8/24 (138)
  #   open 24/24 (117)   close 14/24 (116)
  # Required joint travel (117-166 deg) is larger than the rejected candidate's
  # (33-143), which is the price paid for not blocking the camera.
  home_joints_deg: [39.76, -100.13, -79.28, -131.63, 117.0, 68.12]
  # BOUNDARIES for choosing a press pose. These say what is NOT allowed; the
  # approach roll itself is still searched, never hard-coded.
  #
  # Why this exists: the old rule was "pick the reachable roll with the least joint
  # travel", and measured against the real joint limits (J1 +-178, J2 +-130,
  # J3 +-135, J4 +-178, J5 +-128, J6 +-360, read from the controller) that rule was
  # choosing poses sitting ON a hard stop — button `2` at **0.1 deg** from J3's
  # limit and `4` at 0.7 deg. J3 is the binding joint for every button on this panel.
  # The controller's own self-collision check is also OFF (verified), so "IK returned
  # a solution" is not the same as "safe to execute".
  #
  # Maximising margin instead is NOT the answer either: it swings the path into the
  # panel (measured clearance -12.0 mm for `dot`, -3.4 mm for `A`). Hence constraints
  # plus an objective: reject the unsafe, then take the largest margin among what is
  # left, breaking ties by joint travel.
  limits:
    # Degrees the closest joint must stay clear of its hard stop, checked at BOTH the
    # standoff and the contact pose. 1.0 is deliberately low, not comfortable: the
    # best achievable is 1.0 deg for `2` and 2.1 for `close` from the current home
    # pose, so a stricter floor would make those two unpressable. Their thin margin
    # is a geometry problem to fix with the home pose or the torso lift, not with
    # this number.
    min_joint_margin_deg: 1.0
    # |J5| must stay away from the wrist singularity at J5 = 0, where a straight-line
    # move demands huge joint rates and the controller stalls. Measured range in use
    # is 80-104 deg, so 15 only rejects the pathological cases.
    min_wrist_deg: 15.0
    # Largest allowed single-step joint change along the interpolated path. A
    # configuration flip (elbow or wrist branch change) shows up as a jump far above
    # the ~15 deg/step seen on healthy paths, and executes as a violent detour.
    max_path_jump_deg: 45.0
    # The plunger must not sweep into the faceplate on the way in.
    min_clearance_mm: 5.0
  # TORSO LIFT — the height model that makes this panel-independent.
  #
  # The arm's reachable band is a property of the ARM, expressed as the button's
  # height in the base frame; the lift moves that frame, so any panel height can be
  # brought into the band. Tuning a lift height for one faceplate would produce a
  # constant that is wrong for the next elevator; this is the reusable form.
  #
  # ALL of these were measured on hardware 2026-08-25, and two of them would have
  # been badly wrong if assumed:
  lift:
    controller: left       # the lift hangs off the LEFT arm's controller. The RIGHT
                           # one answers rm_get_lift_state with a meaningless pos=0,
                           # which reads exactly like "the lift is at the bottom".
    # The reported position is TWICE the real vertical travel. Measured over three
    # different moves (76 / 116 / 256 reported) against the camera's own measurement
    # of the panel: ratio 0.5016 / 0.5021 / 0.5008. Trusting the reported number
    # would have put the compensation out by 78 mm, and 1 mm already decides whether
    # the plunger lands on the button or its chamfer.
    command_per_mm: 2.0
    # Verified travel. 1100 is reachable and holds; commanding 1200 hangs the
    # BLOCKING form of rm_set_lift_height forever, so always use the non-blocking
    # form (last arg 0) and poll rm_get_lift_state until mode != 2.
    command_min: 444       # the height this session found it at; lower is untested
    command_max: 1100
    # Height of the base frame's ORIGIN above the floor at command_min. Derived, not
    # guessed: the camera puts the `3`/`4` row at z = +568.4 mm in the base frame and
    # a tape puts it 42-11/16 in = 1084.3 mm off the floor, so the origin sits at
    # 1084.3 - 568.4 = 515.9 mm. Cross-checked by predicting the top row's spacing
    # (86.3 mm) before measuring it: the tape came back 3-3/8 to 3-1/2 in.
    # NOTE the origin is ~525 mm BELOW the arm's own mounting flange, so it is not
    # the arm base — but it does ride the lift (proved by the panel's z changing with
    # lift height), which is all this model needs.
    origin_above_floor_mm: 515.9
    # The lift height is SEARCHED, not computed from a target. There used to be a
    # `target_relative_z_m: 0.240` here, measured at one docking distance and applied
    # everywhere. Re-docked 12 cm further out it selected the WORST heights on offer:
    # button `1` had 12 of 24 approach rolls at the computed height and 0 of 24 one
    # step above, while every height from 444 to 944 gave 24/24 with 41-56 deg of
    # margin. Reachability depends on distance AND height; only height was measured
    # and the result was over-generalised. Searching needs no such map.
    #
    # Step through the travel at this granularity. 50 command units = 25 mm of real
    # rise; the margin surface is smooth over tens of mm, so this is fine and costs
    # ~14 boundary evaluations per button (sub-millisecond IK each).
    search_step: 50
    # A height clearing this margin is "good enough", and among those the one needing
    # the LEAST torso motion wins. That keeps the torso still at a comfortable docking
    # distance — moving it costs seconds and drops the panel out of the camera's view —
    # while still using the full travel when the arm genuinely cannot reach otherwise.
    # 20 deg is well clear of the 1 deg floor that `2` used to press on.
    prefer_margin_deg: 20.0
    # The camera rides the lift too, so raising it drops the panel in the image: past
    # about 175 mm of real rise the bottom row leaves the frame. Hence LOOK LOW,
    # PRESS HIGH — localise at a height where the panel is visible, then raise and
    # compensate. Safe to do because the lift repeats to 0.09 mm at 444 and 0.24 mm
    # at 600, measured as the spread of the panel's z over four cycles.
    max_view_rise_mm: 175
  side: right              # the button-pressing arm (192.168.11.33 on the Orin unit)
  ip: "192.168.11.33"      # left/right VERIFIED 2026-08-14 (hand-push test)
  port: 8080
  max_speed_pct: 20        # SAFETY cap during bring-up; raise once motion is validated

# LinkerHand O6 on the right arm's tool connector (core/hand/linkerhand.py).
# Verified on hardware 2026-08-14. The arm is a GEN-3 controller, so the hand is
# reached with rm_set_modbus_mode/rm_write_registers, not the gen-4 modbus_rtu API.
hand:
  make: linkerhand_o6
  port: 1                  # 1 = tool-board RS485 (0 = controller RS485)
  slave: 0x27              # Modbus slave address (same as ADAM's right hand)
  baudrate: 115200
  speed: 200               # per-joint speed register (0-255)
  press_pose: point        # index extended, rest curled — the pressing posture
  # Index-fingertip TCP offset from the flange face, in the HAND's base frame
  # (meters). Derived from LinkerBot's official O6 URDF + STL meshes:
  #   github.com/linker-bot/linkerhand-urdf -> O6/right
  #   FK at joint angles 0 (= `point`: 255 means "open"/straight) through
  #   rh_index_mcp_pitch -> rh_index_dip, then the farthest vertex of
  #   index_distal.STL. hand_base_link's mesh starts at z=0, i.e. its origin IS
  #   the flange mounting face.
  # Cross-check: the same computation gives 176.90 mm for the MIDDLE fingertip,
  # against 177 mm in the official product manual — 0.1 mm agreement.
  # NOTE the x/y: the index finger is NOT on the hand's centre axis (28 mm off in
  # y). Treating this as a pure z offset would miss the button by ~3 cm.
  # x/y are in the HAND frame — they rotate with however the hand is bolted to the
  # flange (4x M3 on a 20x20 pattern allows 90-degree increments), so confirm the
  # mounting clocking before trusting them. z is unaffected by that rotation.
  fingertip_offset: [0.01188, 0.02808, 0.17287]

# End-effector used for PRESSING. The LinkerHand is still fitted (see `hand:`),
# but pressing is done with a rigid spring plunger bolted to the flange instead of
# a finger: no joints to damage, and the spring itself provides the compliance we
# would otherwise need force control for.
end_effector:
  type: spring_plunger
  # Plunger tip relative to what get_tcp_pose() reports — NOT relative to the
  # flange. A tool frame with z=130 mm is already configured in the controller, so
  # the flange-to-tip length of 154.0 mm measured by hand becomes 24 mm here.
  #
  # Calibrated 2026-08-20 by touching the tip against the `1` button and solving
  #   offset = inv(base_T_tool) @ tip_3d
  # where tip_3d comes from ray-plane against the BUTTON SURFACE (the live panel
  # plane pushed out by the measured 2.3 mm button protrusion).
  # Cross-check vs the hand measurement (6-1/16" axial, 9/8" radial):
  #   axial  24.7 mm  vs  24.0 mm   -> 0.7 mm
  #   radial 26.1 mm  vs  28.6 mm   -> 2.5 mm
  # Skipping the protrusion correction biases the axial term +4.8 mm.
  tcp_offset: [0.02600, -0.00191, 0.02474]

button_yolo:
  weights: data/weights/buttons.pt   # TODO: train on the robot's ~/dataset; single class `button`
  conf: 0.25
  device: cuda
  imgsz: 1280

elevator:
  camera_id: cam_chest
  # Panel plane in the RIGHT-arm base frame: (point on the face, OUTWARD normal).
  #
  # DO NOT rely on these values. The plane is measured LIVE on every approach with
  # core.press.fit_panel_plane_from_depth() — the mobile base docks with centimetres
  # of error, so a stored plane is wrong as soon as the base stops anywhere else.
  # The live fit takes ~5 ms and repeats to ~1 mm, so there is no reason to cache it.
  # These entries are only a sanity-check fallback / a record of a known-good dock.
  #
  # Measured 2026-08-14 in front of the mock panel (93% inliers, 1.0 mm residual,
  # panel vertical to within 1.4 deg):
  panel:
    point:  [0.6818, -0.2508, 0.5661]   # reference only — live fit overrides
    normal: [-0.9997, 0.0072, 0.0248]   # reference only — live fit overrides
  # Buttons stand 2.3 mm PROUD of the faceplate (measured from depth: faceplate
  # -0.2 mm, buttons +2.0..+2.3 mm). So the plunger contacts the button 2.3 mm
  # BEFORE reaching the fitted plane. Aiming at the plane with push_depth=0 would
  # already overpress by 2.3 mm; the target is
  #     plane_point + (button_protrusion - push_depth) * outward_normal
  press:
    standoff: 0.06           # m backed off the panel before/after pressing
    button_protrusion: 0.0023  # m the button sits above the faceplate
    # 3 mm, established on hardware 2026-08-20 by walking it up: 1 mm and 2 mm
    # both failed to light the button, 3 mm lit it repeatably (2/2). The hand-felt
    # estimate of 0.5-1 mm was well short — a hand pressing the button directly
    # feels only the switch travel, while the plunger must ALSO compress its own
    # spring, and that spring eats most of the stroke.
    # Aim at the button CENTRE before adding depth: an early attempt at 2 mm failed
    # purely because the target pixel was eyeballed ~2.5 px off, putting the tip on
    # the button's chamfer. Hough-circle centres fixed that (see button_pixels).
    # If a stiffer button ever needs more than ~5 mm, suspect the spring is too
    # soft (compressing without transmitting force) rather than the stroke.
    push_depth: 0.003
    up_hint: [0.0, 0.0, 1.0]
